services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_DRIVER: mongo
      MONGO_URI: mongodb://mongo:27017/boilerplate
      TRUST_PROXY: 1
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
